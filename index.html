<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Hearthwatch</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/app.css?v=5d3cae2">
</head>
<body>
<div id="app">
  <header id="appbar">
    <div class="bar-title" id="barTitle">Home</div>
    <div class="bar-sub" id="barSub"></div>
  </header>
  <main id="screen"></main>
  <nav id="tabs">
    <button class="tab" data-tab="home"><span class="ico" aria-hidden="true">&#9737;</span>Home</button>
    <button class="tab" data-tab="activity"><span class="ico" aria-hidden="true">&#9776;</span>Activity</button>
    <button class="tab" data-tab="cameras"><span class="ico" aria-hidden="true">&#9635;</span>Cameras</button>
    <button class="tab" data-tab="messages"><span class="ico" aria-hidden="true">&#9993;</span>Messages<span class="badge" id="msgBadge" hidden></span></button>
    <button class="tab" data-tab="settings"><span class="ico" aria-hidden="true">&#9881;</span>Settings</button>
  </nav>
</div>
<div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
<script src="js/data.js?v=5d3cae2"></script>
<script src="js/messages.js?v=5d3cae2"></script>
<script src="js/app.js?v=5d3cae2"></script>
</body>
</html>
